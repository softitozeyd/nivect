name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/setup-dev.sh
      - run: ./scripts/build.sh
      - run: npm --prefix frontend test
      - run: python3 -m pip install -r camera/requirements.lock
      - run: python3 -m unittest discover -s tests -v
      - run: |
          docker compose up -d --wait --wait-timeout 180
          java -jar target/qc-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then break; fi
            sleep 1
          done
          python3 scripts/test-product.py
      - run: |
          npm --prefix frontend run dev > /tmp/frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          npx playwright install --with-deps chromium
          mkdir -p test-results/screenshots
          NIVECT_SCREENSHOTS=test-results/screenshots npx playwright test
      - if: failure()
        run: |
          tail -100 /tmp/backend.log || true
          docker compose logs --tail 30

  legacy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: legacy/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: legacy/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  visionqc-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visionqc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
