name: nivect-dev

services:
  backend:
    profiles: [app]
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nivect}
      POSTGRES_USER: ${POSTGRES_USER:-nivect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-dev.ps1 first}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup-dev.ps1 first}
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-nivect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Run scripts/setup-dev.ps1 first}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-spring-bottle-qc-backend}
      MQTT_TOPIC: ${MQTT_TOPIC:-production/+/inspections}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nivect}
      POSTGRES_USER: ${POSTGRES_USER:-nivect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-dev.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup-dev.ps1 first}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-nivect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Run scripts/setup-dev.ps1 first}
    command:
      - sh
      - -ec
      - |
        mosquitto_passwd -b -c /tmp/nivect.passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /tmp/nivect.passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: [CMD-SHELL, 'mosquitto_pub -h localhost -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t nivect/dev/health -m ok -q 1']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
