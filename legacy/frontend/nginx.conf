server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/v1/production-sessions/latest {
    limit_except GET { deny all; }
    proxy_pass http://backend:8080;
    add_header Cache-Control "no-store" always;
  }
  location = /api/v1/production-sessions {
    limit_except POST { deny all; }
    proxy_pass http://backend:8080;
  }
  location ~ ^/api/v1/production-sessions/[1-9][0-9]*/(stop|products)$ {
    limit_except POST { deny all; }
    proxy_pass http://backend:8080;
  }
  location = /api/v1/summary {
    limit_except GET { deny all; }
    proxy_pass http://backend:8080;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location = /api/v1/reviews {
    limit_except GET { deny all; }
    proxy_pass http://backend:8080;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location ~ ^/api/v1/reviews/(NIV|MD)-[1-9][0-9]*$ {
    limit_except PUT { deny all; }
    proxy_pass http://backend:8080;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location = /api/v1/model-detections {
    limit_except GET POST { deny all; }
    proxy_pass http://backend:8080;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location = /api/v1/inspections {
    limit_except GET { deny all; }
    proxy_pass http://backend:8080;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location = /api/v1/inspections/failures {
    limit_except GET { deny all; }
    proxy_pass http://backend:8080;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location = /actuator/health {
    limit_except GET { deny all; }
    proxy_pass http://backend:8080;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location /api/ { return 404; }
  location /actuator/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
