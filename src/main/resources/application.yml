server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  codec:
    max-in-memory-size: 2MB
  application:
    name: bottle-qc

  # 1. PostgreSQL Veritabanı Bağlantı Ayarları
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nivect}
    username: ${POSTGRES_USER:nivect}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 5000

  # 2. JPA & Hibernate Performans ve Batch Ayarları
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false # Yüksek hız için SQL loglarını kapalı tutuyoruz
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 500 # Redis'ten gelen verileri DB'ye 500'erli toplu yazma
          order_inserts: true
          order_updates: true
        generate_statistics: false

  # 3. Redis In-Memory Buffer Bağlantı Ayarları
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# 4. MQTT Broker Bağlantı Ayarları (Kamera Akışı İçin Özel Parametreler)
mqtt:
  broker:
    url: ${MQTT_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:spring-bottle-qc-backend}
    username: ${MQTT_USERNAME:nivect}
    password: ${MQTT_PASSWORD}
    topic: ${MQTT_TOPIC:production/+/inspections}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

qc:
  minimum-confidence: ${QC_MINIMUM_CONFIDENCE:0.65}
  vision-url: ${QC_VISION_URL:http://127.0.0.1:9000}
server.reactive.session:
  timeout: 8h
  cookie:
    http-only: true
    same-site: strict
    secure: ${QC_SECURE_COOKIE:false}
